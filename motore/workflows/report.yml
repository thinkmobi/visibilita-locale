# Genera il PDF da stampare quando l'app salva zone/<id>/stampa.json
name: Genera PDF
on:
  push:
    paths: ["zone/*/stampa.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dati
  cancel-in-progress: false
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: motore/requirements.txt
      - run: pip install -r motore/requirements.txt
      - name: Genera i PDF richiesti
        run: |
          for job in zone/*/stampa.json; do
            dir=$(dirname "$job")
            if python3 -c "import json,sys;j=json.load(open('$job'));e=json.load(open('$dir/stampa/esito.json'));sys.exit(0 if e.get('richiesta')==j.get('richiesta') else 1)" 2>/dev/null; then
              echo "già generato: $dir"; continue
            fi
            python3 motore/report.py "$job" || python3 -c "import json,os;j=json.load(open('$job'));os.makedirs('$dir/stampa',exist_ok=True);json.dump({'richiesta':j.get('richiesta'),'errore':'generazione fallita: vedi il log in Actions'},open('$dir/stampa/esito.json','w'))"
          done
      - name: Salva nel repository
        run: |
          git config user.name "visibilita-bot"
          git config user.email "visibilita-bot@users.noreply.github.com"
          git add zone
          git diff --cached --quiet && exit 0
          git commit -m "PDF di stampa"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
