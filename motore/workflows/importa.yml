# Importa le scansioni Local Falcon richieste dall'app (zone/<id>/richiesta.json)
name: Importa scansione
on:
  push:
    paths: ["zone/*/richiesta.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dati
  cancel-in-progress: false
jobs:
  importa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Importa le richieste nuove
        env:
          LOCALFALCON_API_KEY: ${{ secrets.LOCALFALCON_API_KEY }}
        run: |
          for rq in zone/*/richiesta.json; do
            dir=$(dirname "$rq")
            if python3 -c "import json,sys;r=json.load(open('$rq'));e=json.load(open('$dir/importa-esito.json'));sys.exit(0 if e.get('report_key')==r.get('report_key') and e.get('stato')=='ok' else 1)" 2>/dev/null; then
              echo "già importata: $dir"; continue
            fi
            python3 motore/importa.py "$rq"
          done
      - name: Salva nel repository
        run: |
          git config user.name "visibilita-bot"
          git config user.email "visibilita-bot@users.noreply.github.com"
          git add zone
          git diff --cached --quiet && exit 0
          git commit -m "Importa scansione Local Falcon"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
