# Controlla i siti delle attività quando l'app lo chiede (zone/<id>/siti-richiesta.json),
# ogni lunedì mattina e a mano dalla scheda Actions.
name: Controllo siti
on:
  push:
    paths: ["zone/*/siti-richiesta.json"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dati
  cancel-in-progress: false
jobs:
  siti:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Zone da controllare
        id: zone
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            git diff --name-only HEAD~1 HEAD | grep -E '^zone/[^/]+/siti-richiesta\.json$' | xargs -r -n1 dirname | sort -u > zone.txt
          else
            ls -d zone/*/ | sed 's#/$##' > zone.txt
          fi
          cat zone.txt
      - name: Controllo
        run: |
          while read -r z; do [ -f "$z/zona.json" ] && python3 motore/siti.py "$z"; done < zone.txt
      - name: Salva nel repository
        run: |
          git config user.name "visibilita-bot"
          git config user.email "visibilita-bot@users.noreply.github.com"
          git add zone/*/siti.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Controllo siti"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
